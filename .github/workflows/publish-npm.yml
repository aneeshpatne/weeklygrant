name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1+; Node 22's bundled npm is older.
      - run: npm install -g npm@latest

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm pack --dry-run

      - name: Check release tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "GitHub release tag '$GITHUB_REF_NAME' does not match package.json version '$version'."
            exit 1
          fi

      # OIDC is used when a trusted publisher is configured on npmjs.com.
      # NODE_AUTH_TOKEN is a fallback if NPM_TOKEN is set as a repo secret.
      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
