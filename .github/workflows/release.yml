name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match package.json version '$version'."
            exit 1
          fi

      # Trusted Publishing: GitHub OIDC only — no NPM_TOKEN.
      # npm generates provenance automatically for this path.
      - name: Publish
        run: npm publish --access public --ignore-scripts
